services:
  - type: web
    name: campussync-event-planner
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
